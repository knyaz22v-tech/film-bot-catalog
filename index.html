<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Каталог фотоаппаратов</title>
  <!-- Официальный скрипт Telegram для Mini App: тема, кнопка «Назад», окна подтверждения. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Общие стили каталога и админ-панели: один файл, чтобы дизайн совпадал. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Каталог фотоаппаратов</h1>
    <p>Плёночные камеры от «Плёночного друга»</p>
  </header>

  <main>
    <div id="grid" class="grid"></div>
    <div id="message" class="message">Загружаю каталог…</div>
  </main>

  <section id="detail" class="detail" aria-hidden="true">
    <!-- Фото товара: листаются свайпом или стрелками, точки показывают, какое фото открыто. -->
    <div id="gallery" class="gallery">
      <div id="gallery-track" class="gallery-track"></div>
      <button id="gallery-prev" class="gallery-arrow prev" type="button" aria-label="Предыдущее фото">‹</button>
      <button id="gallery-next" class="gallery-arrow next" type="button" aria-label="Следующее фото">›</button>
      <div id="gallery-dots" class="gallery-dots"></div>
    </div>
    <div class="body">
      <h2 id="detail-title"></h2>
      <div id="detail-price" class="price"></div>
      <div id="detail-description" class="description"></div>
    </div>
    <div class="actions">
      <button id="detail-back" class="back" type="button">Назад</button>
      <button id="detail-buy" class="buy" type="button">Хочу купить</button>
    </div>
  </section>

  <script>
    // Telegram.WebApp есть, только когда страница открыта внутри Telegram.
    const telegram = window.Telegram ? window.Telegram.WebApp : null;
    const texts = {
      empty: "Каталог пока пуст. Загляни чуть позже!",
      loadFailed: "Не получилось загрузить каталог. Закрой окно и открой каталог ещё раз.",
      noBot: "Не получилось открыть чат с ботом. Закрой окно и открой каталог ещё раз.",
    };

    let openedProduct = null;
    // Имя бота приходит в catalog.json: по нему кнопка «Хочу купить» открывает чат с ботом.
    let botUsername = "";

    if (telegram) {
      telegram.ready();
      telegram.expand();
      // Шапка и фон Telegram вокруг окна — белые, как страница.
      telegram.setHeaderColor("#ffffff");
      telegram.setBackgroundColor("#ffffff");
      telegram.BackButton.onClick(closeDetail);
    }

    function showMessage(text) {
      document.getElementById("message").textContent = text;
    }

    function alertUser(text) {
      if (telegram) telegram.showAlert(text); else alert(text);
    }

    // Карточку собираем через textContent, а не innerHTML: так текст из базы не может
    // случайно превратиться в код страницы.
    function createCard(product) {
      const card = document.createElement("article");
      card.className = "card";
      const photo = document.createElement("img");
      photo.src = product.photo_url;
      photo.alt = product.title;
      photo.loading = "lazy";
      const info = document.createElement("div");
      info.className = "info";
      const title = document.createElement("p");
      title.className = "title";
      title.textContent = product.title;
      const price = document.createElement("div");
      price.className = "price";
      price.textContent = product.price;
      info.append(title, price);
      card.append(photo, info);
      addHoldPreview(card, photo, product);
      return card;
    }

    // --- Листалка фото ---
    // Фото стоят в ряд, браузер сам листает их свайпом (scroll-snap — прокрутка
    // «защёлкивается» ровно на одном фото). Стрелки листают на одно фото, точки показывают номер.

    const track = document.getElementById("gallery-track");

    function currentPhotoIndex() {
      return track.clientWidth ? Math.round(track.scrollLeft / track.clientWidth) : 0;
    }

    function updateGalleryControls() {
      const count = track.children.length;
      const index = currentPhotoIndex();
      document.querySelectorAll("#gallery-dots span").forEach((dot, dotIndex) => {
        dot.classList.toggle("active", dotIndex === index);
      });
      document.getElementById("gallery-prev").disabled = index <= 0;
      document.getElementById("gallery-next").disabled = index >= count - 1;
    }

    function showPhotos(product) {
      // В старом catalog.json было только одно фото (photo_url) — поддерживаем и его.
      const urls = product.photos && product.photos.length ? product.photos : [product.photo_url];
      track.replaceChildren(...urls.map((url, index) => {
        const photo = document.createElement("img");
        photo.src = url;
        photo.alt = product.title + " — фото " + (index + 1);
        return photo;
      }));
      document.getElementById("gallery-dots").replaceChildren(
        ...urls.map(() => document.createElement("span"))
      );
      document.getElementById("gallery").classList.toggle("single", urls.length < 2);
      track.style.scrollBehavior = "auto";
      track.scrollLeft = 0; // новая карточка всегда открывается с первого фото
      track.style.scrollBehavior = "";
      updateGalleryControls();
    }

    function scrollPhotos(step) {
      track.scrollTo({ left: (currentPhotoIndex() + step) * track.clientWidth });
    }

    track.addEventListener("scroll", updateGalleryControls);
    document.getElementById("gallery-prev").addEventListener("click", () => scrollPhotos(-1));
    document.getElementById("gallery-next").addEventListener("click", () => scrollPhotos(1));

    // --- Зажатие карточки: просмотр фото прямо в списке ---
    // Пока палец (или кнопка мышки) зажаты на карточке, фото плавно становится цветным
    // и каждые 2 секунды меняется на следующее: 1 → 2 → 3 → снова 1.
    // Отпустили — снова обложка в ЧБ. Короткое нажатие открывает карточку товара,
    // а зажатие дольше полсекунды — нет: это просто просмотр фото.
    const PHOTO_CHANGE_MS = 2000;
    const LONG_PRESS_MS = 500;

    function addHoldPreview(card, photo, product) {
      const urls = product.photos && product.photos.length ? product.photos : [product.photo_url];
      let pressedAt = 0; // когда зажали; 0 — сейчас не зажато
      let timer = null;
      let index = 0;
      let wasLongPress = false;

      function startHold(event) {
        if (event.pointerType === "mouse" && event.button !== 0) return; // только левая кнопка
        pressedAt = Date.now();
        wasLongPress = false;
        index = 0;
        card.classList.add("in-color");
        urls.slice(1).forEach((url) => { new Image().src = url; }); // заранее загружаем остальные фото
        if (urls.length > 1) {
          timer = setInterval(() => {
            index = (index + 1) % urls.length;
            photo.src = urls[index];
          }, PHOTO_CHANGE_MS);
        }
      }

      function stopHold() {
        if (!pressedAt) return;
        wasLongPress = Date.now() - pressedAt >= LONG_PRESS_MS;
        pressedAt = 0;
        clearInterval(timer);
        timer = null;
        card.classList.remove("in-color");
        photo.src = urls[0]; // снова обложка
      }

      card.addEventListener("pointerdown", startHold);
      // Отпустили палец, ушли мышкой с карточки или начали листать страницу — заканчиваем просмотр.
      card.addEventListener("pointerup", stopHold);
      card.addEventListener("pointercancel", stopHold);
      card.addEventListener("pointerleave", stopHold);
      // Долгое нажатие не должно открывать меню телефона поверх карточки.
      card.addEventListener("contextmenu", (event) => event.preventDefault());
      card.addEventListener("click", () => {
        if (wasLongPress) {
          wasLongPress = false; // это было зажатие для просмотра фото — карточку не открываем
          return;
        }
        openDetail(product);
      });
    }

    function openDetail(product) {
      openedProduct = product;
      document.getElementById("detail-title").textContent = product.title;
      document.getElementById("detail-price").textContent = product.price;
      document.getElementById("detail-description").textContent = product.description;
      const detail = document.getElementById("detail");
      detail.classList.add("open");
      detail.setAttribute("aria-hidden", "false");
      detail.scrollTop = 0;
      // Фото показываем, когда карточка уже видна: иначе ширина листалки ещё неизвестна.
      showPhotos(product);
      if (telegram) telegram.BackButton.show();
    }

    function closeDetail() {
      openedProduct = null;
      const detail = document.getElementById("detail");
      detail.classList.remove("open");
      detail.setAttribute("aria-hidden", "true");
      if (telegram) telegram.BackButton.hide();
    }

    // «Хочу купить» открывает чат с ботом по ссылке t.me/бот?start=buy_12.
    // Бот покажет товар, спросит подтверждение и отправит заявку админам.
    // Так серверу каталога не нужно принимать заявки: хватает файлов на GitHub Pages.
    function buy(product) {
      if (!botUsername) {
        alertUser(texts.noBot);
        return;
      }
      const link = "https://t.me/" + botUsername + "?start=buy_" + product.id;
      if (telegram) {
        telegram.openTelegramLink(link);
        telegram.close();
      } else {
        window.open(link, "_blank");
      }
    }

    document.getElementById("detail-back").addEventListener("click", closeDetail);
    document.getElementById("detail-buy").addEventListener("click", () => {
      if (openedProduct) buy(openedProduct);
    });

    async function loadCatalog() {
      try {
        // cache: "no-store" — всегда свежий список, а не сохранённый браузером.
        const response = await fetch("catalog.json", { cache: "no-store" });
        if (!response.ok) throw new Error("bad status");
        const catalog = await response.json();
        botUsername = catalog.bot_username;
        const products = catalog.products;
        const grid = document.getElementById("grid");
        grid.replaceChildren(...products.map(createCard));
        showMessage(products.length ? "" : texts.empty);
      } catch (error) {
        showMessage(texts.loadFailed);
      }
    }

    loadCatalog();
  </script>
</body>
</html>
