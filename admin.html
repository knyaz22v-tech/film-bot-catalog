<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Админ-панель каталога</title>
  <!-- Официальный скрипт Telegram для Mini App. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Те же стили, что у каталога: дизайн совпадает. -->
  <link rel="stylesheet" href="style.css?v=10b6176d">
</head>
<body>
  <header>
    <h1>Админ-панель</h1>
    <p>Каталог фотоаппаратов</p>
  </header>

  <div class="toolbar">
    <button id="add" class="primary" type="button">+ Добавить фотоаппарат</button>
    <button id="open-categories" type="button">Категории</button>
  </div>

  <main>
    <div id="list" class="list"></div>
    <div id="message" class="message">Загружаю товары…</div>
  </main>

  <!-- Редактор товара поверх списка (как карточка в каталоге). -->
  <section id="editor" class="detail" aria-hidden="true">
    <div class="body">
      <h2 id="editor-heading"></h2>
      <form id="form" class="form">
        <label>Название
          <input id="field-title" name="title" maxlength="100" required>
        </label>
        <label>Цена, ₽
          <input id="field-price" name="price" inputmode="numeric" required>
        </label>
        <label>Описание
          <textarea id="field-description" name="description" maxlength="900" required></textarea>
        </label>
        <label>Категория
          <select id="field-category" name="category_id"></select>
        </label>
        <!-- Фото товара (до 5): первое — обложка, крестик удаляет фото. -->
        <div id="photos-block">
          <p class="field-name">Фото</p>
          <div id="thumbs" class="thumbs"></div>
        </div>
        <!-- Фото из файлов — только на компьютере (локальный режим). Можно выбрать несколько. -->
        <!-- Новый товар: сначала обложка (главное фото), потом остальные фото. -->
        <label id="cover-field">Обложка
          <input id="field-cover" type="file" accept="image/jpeg,image/png">
        </label>
        <label id="photo-field"><span id="photo-field-name">Добавить фото</span>
          <input id="field-photo" name="photo" type="file" accept="image/jpeg,image/png" multiple>
        </label>
        <p id="photo-hint" class="hint"></p>
        <div class="buttons">
          <button id="save" class="primary" type="submit">Сохранить</button>
          <button id="change-photo" type="button">Добавить фото</button>
          <button id="toggle" type="button"></button>
          <button id="delete" class="danger" type="button">Удалить</button>
        </div>
      </form>
    </div>
    <div class="actions">
      <button id="editor-back" class="back" type="button">Назад</button>
    </div>
  </section>

  <!-- Категории: вкладки в каталоге. Добавить, переименовать, поменять порядок, удалить. -->
  <section id="categories" class="detail" aria-hidden="true">
    <div class="body">
      <h2>Категории</h2>
      <p class="hint">Категории — это вкладки над товарами в каталоге. Пустые категории клиенты не видят.</p>
      <form id="category-form" class="form category-add">
        <label>Новая категория
          <input id="field-category-title" maxlength="40" placeholder="Например: Объективы" required>
        </label>
        <button class="primary" type="submit">+ Добавить категорию</button>
      </form>
      <div id="category-list" class="list category-list"></div>
      <div id="category-message" class="message"></div>
    </div>
    <div class="actions">
      <button id="categories-back" class="back" type="button">Назад</button>
    </div>
  </section>

  <script>
    // Панель работает в двух режимах:
    // - локальный (открыта на компьютере, где работает бот: http://127.0.0.1:8080/admin.html) —
    //   правки и фото сразу уходят боту через его локальный сервер;
    // - Telegram (открыта кнопкой «🛠 Админ-панель» в чате с ботом) — правки уходят боту
    //   через Telegram (sendData), а фото бот попросит прислать сообщением в чат.
    // У товара может быть до 5 фото: первое — обложка, остальные клиент листает в карточке.
    const MAX_PHOTOS = 5;
    const telegram = window.Telegram ? window.Telegram.WebApp : null;
    const isLocal = ["127.0.0.1", "localhost"].includes(location.hostname);
    const inTelegram = !isLocal && telegram && telegram.platform !== "unknown";

    const texts = {
      loadFailed: "Не получилось загрузить товары. Закрой панель и открой её ещё раз.",
      empty: "Товаров пока нет. Нажми «Добавить фотоаппарат».",
      notInTelegram: "Открой панель кнопкой «🛠 Админ-панель» внизу чата с ботом (команда /admin).",
      newHeading: "Новый фотоаппарат",
      editHeading: "Изменить товар",
      hide: "Скрыть от клиентов",
      show: "Показать клиентам",
      confirmDelete: (title) => "Удалить «" + title + "» из каталога? Вернуть его не получится.",
      needPhoto: "Сначала выбери обложку — главное фото фотоаппарата.",
      photoLocalNew: "Сначала выбери обложку — главное фото, его клиенты видят в списке. Потом, если нужно, ещё до 4 фото.",
      otherPhotos: "Остальные фото",
      addPhotos: "Добавить фото",
      photoLocalEdit: (free) => "Можно добавить ещё " + free + " фото. Новые встанут после прежних.",
      photoInChatNew: "Фото (от 1 до 5) пришлёшь в чат с ботом после сохранения.",
      photoInChatEdit: (free) => "Можно добавить ещё " + free + " фото: нажми «Добавить фото», и бот попросит прислать их в чат.",
      photosFull: "Фото уже 5 — это максимум. Чтобы добавить новое, удали лишнее крестиком.",
      tooManyPhotos: (free) => "Можно добавить не больше " + free + " фото.",
      confirmDeletePhoto: "Удалить это фото? Вернуть его не получится.",
      lastPhoto: "Это единственное фото товара. Сначала добавь другое.",
      cover: "обложка",
      noCategory: "без категории",
      noCategories: "Категорий пока нет. Добавь первую — например, «Камеры».",
      productsCount: (count) => "Товаров: " + count,
      saveCategory: "Сохранить",
      deleteCategory: "Удалить",
      moveUp: "Левее",
      moveDown: "Правее",
      confirmDeleteCategory: (title) => "Удалить категорию «" + title + "»?",
      categoryNotEmpty: (title, count) =>
        "В категории «" + title + "» есть товары (" + count + "). Сначала перенеси их в другую категорию, потом удаляй.",
      noPhoto: "фото скрыто",
      visible: "видят клиенты",
      hidden: "скрыт",
      networkError: "Не получилось связаться с ботом. Проверь, что бот запущен.",
    };

    let products = [];
    let categories = []; // по порядку вкладок: {id, title, products — сколько товаров}
    let editing = null; // товар, который сейчас открыт (null — новый товар)

    if (telegram) {
      telegram.ready();
      telegram.expand();
      telegram.setHeaderColor("#ffffff");
      telegram.setBackgroundColor("#ffffff");
      telegram.BackButton.onClick(goBack);
    }

    function alertUser(text) {
      if (inTelegram) telegram.showAlert(text); else alert(text);
    }

    function confirmUser(text, callback) {
      if (inTelegram) telegram.showConfirm(text, callback); else callback(confirm(text));
    }

    function showMessage(text) {
      document.getElementById("message").textContent = text;
    }

    // --- Отправка правок боту ---

    // Telegram-режим: данные уходят боту сообщением, окно панели закрывается само.
    function sendToBot(data) {
      if (!inTelegram) {
        alertUser(texts.notInTelegram);
        return;
      }
      telegram.sendData(JSON.stringify(data));
    }

    // Локальный режим: запрос к серверу бота. Заголовок X-Admin-Panel защищает от
    // команд с чужих сайтов: браузер не даст постороннему сайту его поставить.
    // reopenId — после успешной правки снова открыть этот товар (например, после удаления фото).
    async function callLocal(path, formData, reopenId) {
      try {
        const response = await fetch(path, {
          method: "POST",
          headers: { "X-Admin-Panel": "1" },
          body: formData || new FormData(),
        });
        const answer = await response.json();
        alertUser(answer.message);
        if (answer.ok) {
          closeEditor();
          await loadProducts();
          const reopened = products.find((product) => product.id === reopenId);
          if (reopened) openEditor(reopened);
        }
      } catch (error) {
        alertUser(texts.networkError);
      }
    }

    // --- Список товаров ---

    function createRow(product) {
      const row = document.createElement("article");
      row.className = "row";
      let photo;
      if (product.photo_url) {
        photo = document.createElement("img");
        photo.src = product.photo_url;
        photo.alt = product.title;
        photo.loading = "lazy";
      } else {
        photo = document.createElement("div");
        photo.className = "no-photo";
        photo.textContent = texts.noPhoto;
      }
      const info = document.createElement("div");
      info.className = "info";
      const title = document.createElement("p");
      title.className = "title";
      title.textContent = product.title;
      const price = document.createElement("div");
      price.className = "price";
      price.textContent = product.price;
      const badge = document.createElement("span");
      badge.className = product.is_active ? "badge" : "badge hidden";
      badge.textContent = product.is_active ? texts.visible : texts.hidden;
      const category = document.createElement("span");
      category.className = product.category_id === null || product.category_id === undefined
        ? "badge hidden" : "badge";
      category.textContent = categoryTitle(product.category_id);
      info.append(title, price, badge, category);
      row.append(photo, info);
      row.addEventListener("click", () => openEditor(product));
      return row;
    }

    async function loadProducts() {
      try {
        const response = isLocal
          ? await fetch("api/admin/products", { headers: { "X-Admin-Panel": "1" }, cache: "no-store" })
          : await fetch("admin.json", { cache: "no-store" });
        if (!response.ok) throw new Error("bad status");
        const data = await response.json();
        products = data.products;
        categories = data.categories || [];
        document.getElementById("list").replaceChildren(...products.map(createRow));
        renderCategories();
        showMessage(products.length ? "" : texts.empty);
      } catch (error) {
        showMessage(texts.loadFailed);
      }
    }

    // --- Редактор ---

    function photosOf(product) {
      return product && product.photos ? product.photos : [];
    }

    // Миниатюры фото товара. Крестик есть, только если фото больше одного:
    // без фото товар не показать клиентам.
    function renderThumbs(product) {
      const photos = photosOf(product);
      document.getElementById("photos-block").style.display = photos.length ? "block" : "none";
      document.getElementById("thumbs").replaceChildren(...photos.map((photo, index) => {
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        let picture;
        if (photo.url) {
          picture = document.createElement("img");
          picture.src = photo.url;
          picture.alt = product.title;
        } else {
          picture = document.createElement("div");
          picture.className = "no-photo";
          picture.textContent = texts.noPhoto;
        }
        thumb.append(picture);
        if (photos.length > 1) {
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove";
          remove.textContent = "×";
          remove.setAttribute("aria-label", "Удалить фото");
          remove.addEventListener("click", () => deletePhoto(product, photo));
          thumb.append(remove);
        }
        if (index === 0) {
          const cover = document.createElement("span");
          cover.className = "cover";
          cover.textContent = texts.cover;
          thumb.append(cover);
        }
        return thumb;
      }));
    }

    function deletePhoto(product, photo) {
      if (photosOf(product).length < 2) {
        alertUser(texts.lastPhoto);
        return;
      }
      confirmUser(texts.confirmDeletePhoto, (agreed) => {
        if (!agreed) return;
        if (isLocal) {
          callLocal("api/admin/products/" + product.id + "/photos/" + photo.id + "/delete", null, product.id);
        } else {
          sendToBot({ action: "delete_photo", id: product.id, photo_id: photo.id });
        }
      });
    }

    // Сколько фото ещё можно добавить товару (новому — все 5).
    function freePhotoPlaces(product) {
      return Math.max(MAX_PHOTOS - photosOf(product).length, 0);
    }

    function openEditor(product) {
      editing = product;
      const isNew = product === null;
      document.getElementById("editor-heading").textContent = isNew ? texts.newHeading : texts.editHeading;
      document.getElementById("field-title").value = isNew ? "" : product.title;
      document.getElementById("field-price").value = isNew ? "" : product.price_value;
      document.getElementById("field-description").value = isNew ? "" : product.description;
      fillCategorySelect(isNew ? null : product.category_id);
      document.getElementById("field-photo").value = "";
      document.getElementById("field-cover").value = "";
      renderThumbs(product);

      // Фото из файлов можно выбрать только на компьютере; в Telegram — прислать в чат.
      const free = freePhotoPlaces(product);
      document.getElementById("cover-field").style.display = isLocal && isNew ? "block" : "none";
      document.getElementById("photo-field").style.display = isLocal && free > 0 ? "block" : "none";
      document.getElementById("photo-field-name").textContent = isNew ? texts.otherPhotos : texts.addPhotos;
      document.getElementById("change-photo").style.display = !isLocal && !isNew && free > 0 ? "block" : "none";
      let hint;
      if (free === 0) hint = texts.photosFull;
      else if (isLocal) hint = isNew ? texts.photoLocalNew : texts.photoLocalEdit(free);
      else hint = isNew ? texts.photoInChatNew : texts.photoInChatEdit(free);
      document.getElementById("photo-hint").textContent = hint;

      const toggle = document.getElementById("toggle");
      toggle.style.display = isNew ? "none" : "block";
      if (!isNew) toggle.textContent = product.is_active ? texts.hide : texts.show;
      document.getElementById("delete").style.display = isNew ? "none" : "block";

      const editor = document.getElementById("editor");
      editor.classList.add("open");
      editor.setAttribute("aria-hidden", "false");
      editor.scrollTop = 0;
      if (telegram) telegram.BackButton.show();
    }

    function closeEditor() {
      editing = null;
      const editor = document.getElementById("editor");
      editor.classList.remove("open");
      editor.setAttribute("aria-hidden", "true");
      if (telegram) telegram.BackButton.hide();
    }

    function formFields() {
      return {
        title: document.getElementById("field-title").value,
        price: document.getElementById("field-price").value,
        description: document.getElementById("field-description").value,
        // Пустой выбор — «без категории» (null), иначе номер категории.
        category_id: document.getElementById("field-category").value
          ? Number(document.getElementById("field-category").value) : null,
      };
    }

    document.getElementById("form").addEventListener("submit", (event) => {
      event.preventDefault();
      const fields = formFields();
      if (!isLocal) {
        sendToBot(editing === null
          ? { action: "add", ...fields }
          : { action: "edit", id: editing.id, ...fields });
        return;
      }
      const data = new FormData();
      data.append("title", fields.title);
      data.append("price", fields.price);
      data.append("description", fields.description);
      data.append("category_id", fields.category_id === null ? "" : String(fields.category_id));
      // Новый товар: обложка идёт первой, за ней остальные фото — в таком порядке их и сохранит бот.
      const cover = document.getElementById("field-cover").files[0];
      if (editing === null && !cover) {
        alertUser(texts.needPhoto);
        return;
      }
      const files = Array.from(document.getElementById("field-photo").files);
      if (editing === null) files.unshift(cover);
      const free = freePhotoPlaces(editing);
      if (files.length > free) {
        alertUser(texts.tooManyPhotos(free));
        return;
      }
      files.forEach((file) => data.append("photo", file));
      callLocal(editing === null ? "api/admin/products" : "api/admin/products/" + editing.id, data);
    });

    document.getElementById("change-photo").addEventListener("click", () => {
      if (editing) sendToBot({ action: "photo", id: editing.id });
    });

    document.getElementById("toggle").addEventListener("click", () => {
      if (!editing) return;
      if (isLocal) callLocal("api/admin/products/" + editing.id + "/toggle");
      else sendToBot({ action: "toggle", id: editing.id });
    });

    document.getElementById("delete").addEventListener("click", () => {
      if (!editing) return;
      const product = editing;
      confirmUser(texts.confirmDelete(product.title), (agreed) => {
        if (!agreed) return;
        if (isLocal) callLocal("api/admin/products/" + product.id + "/delete");
        else sendToBot({ action: "delete", id: product.id });
      });
    });

    // --- Категории ---

    function categoryTitle(categoryId) {
      const category = categories.find((item) => item.id === categoryId);
      return category ? category.title : texts.noCategory;
    }

    // Список «Категория» в редакторе: «без категории» и все категории.
    function fillCategorySelect(selectedId) {
      const select = document.getElementById("field-category");
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = texts.noCategory;
      select.replaceChildren(empty, ...categories.map((category) => {
        const option = document.createElement("option");
        option.value = String(category.id);
        option.textContent = category.title;
        return option;
      }));
      select.value = selectedId === null || selectedId === undefined ? "" : String(selectedId);
    }

    // Действие с категорией: на компьютере — запрос к боту, в Telegram — сообщение боту.
    function categoryAction(action, category, extra) {
      if (isLocal) {
        const data = new FormData();
        Object.entries(extra || {}).forEach(([key, value]) => data.append(key, value));
        const paths = {
          category_add: "api/admin/categories",
          category_rename: "api/admin/categories/" + (category && category.id),
          category_delete: "api/admin/categories/" + (category && category.id) + "/delete",
          category_move: "api/admin/categories/" + (category && category.id) + "/move",
        };
        callLocal(paths[action], data);
      } else {
        sendToBot({ action, category_id: category ? category.id : undefined, ...(extra || {}) });
      }
    }

    function smallButton(text, onClick, className) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = text;
      if (className) button.className = className;
      button.addEventListener("click", onClick);
      return button;
    }

    // Строка категории: название можно поправить прямо в поле, рядом — кнопки.
    function createCategoryRow(category, index) {
      const row = document.createElement("div");
      row.className = "category-row";
      const input = document.createElement("input");
      input.value = category.title;
      input.maxLength = 40;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = texts.productsCount(category.products);
      const buttons = document.createElement("div");
      buttons.className = "category-buttons";
      const up = smallButton(texts.moveUp, () => categoryAction("category_move", category, { direction: "up" }));
      up.disabled = index === 0;
      const down = smallButton(texts.moveDown, () => categoryAction("category_move", category, { direction: "down" }));
      down.disabled = index === categories.length - 1;
      buttons.append(
        up,
        down,
        smallButton(texts.saveCategory, () => categoryAction("category_rename", category, { title: input.value })),
        smallButton(texts.deleteCategory, () => {
          if (category.products > 0) {
            alertUser(texts.categoryNotEmpty(category.title, category.products));
            return;
          }
          confirmUser(texts.confirmDeleteCategory(category.title), (agreed) => {
            if (agreed) categoryAction("category_delete", category);
          });
        }, "danger"),
      );
      row.append(input, count, buttons);
      return row;
    }

    function renderCategories() {
      document.getElementById("category-list").replaceChildren(...categories.map(createCategoryRow));
      document.getElementById("category-message").textContent = categories.length ? "" : texts.noCategories;
    }

    function openCategories() {
      renderCategories();
      document.getElementById("field-category-title").value = "";
      const screen = document.getElementById("categories");
      screen.classList.add("open");
      screen.setAttribute("aria-hidden", "false");
      screen.scrollTop = 0;
      if (telegram) telegram.BackButton.show();
    }

    function closeCategories() {
      const screen = document.getElementById("categories");
      screen.classList.remove("open");
      screen.setAttribute("aria-hidden", "true");
      if (telegram) telegram.BackButton.hide();
    }

    // Кнопка «Назад» в шапке Telegram: закрывает редактор, а если он не открыт — экран категорий.
    function goBack() {
      if (document.getElementById("editor").classList.contains("open")) closeEditor();
      else closeCategories();
    }

    document.getElementById("category-form").addEventListener("submit", (event) => {
      event.preventDefault();
      categoryAction("category_add", null, { title: document.getElementById("field-category-title").value });
    });
    document.getElementById("open-categories").addEventListener("click", openCategories);
    document.getElementById("categories-back").addEventListener("click", closeCategories);

    document.getElementById("add").addEventListener("click", () => openEditor(null));
    document.getElementById("editor-back").addEventListener("click", closeEditor);

    loadProducts();
  </script>
</body>
</html>
